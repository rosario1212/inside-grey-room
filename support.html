pt>const API='https://jtasbdiguhiswoyvobkn.supabase.co/functions/v1/igr-account',KEY='sb_publishable__I1lNSf1dyQRHz1jY8As1Q_zAwh8j13';async function sendSupport(){const s=document.getElementById('status');s.textContent='Envoi…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action:'support_request',category:document.getElementById('category').value,contact_email:document.getElementById('email').value.trim(),message:document.getElementById('message').value.trim()})}),j=await r.json().catch(()=>({}));if(!r.ok)throw 0;s.textContent='Demande enregistrée. Référence : '+j.requestId;document.getElementById('message').value=''}catch{s.textContent='Envoi impossible. Vérifie que ton message contient au moins 10 caractères.'}}</script></body></html>
