name: OMERTA 80-20 Editorial Gates

on:
  pull_request:
    paths:
      - 'docs/OMERTA_SANTORO_FIVE_STANDALONE_CASES_V7.md'
      - 'docs/OMERTA_SANTORO_V8_VIOLENCE_INDIC_FAMILY_TREE.md'
      - 'qa/omerta-v8-mafia-release-contract.json'
      - 'scripts/check-omerta-v8-mafia.mjs'
      - 'scripts/check-omerta-v9-player-tree.mjs'
      - 'docs/OMERTA_V11_MANDATORY_SECRET_INFORMANT_FIVE_95_CASES.md'
      - 'qa/omerta-v11-indic-mandatory-95-contract.json'
      - 'scripts/check-omerta-v11-indic-95.mjs'
      - 'docs/OMERTA_V12_PERSONAL_INDIC_AND_MAFIA_ATMOSPHERE.md'
      - 'qa/omerta-v12-indic-self-interest-and-atmosphere.json'
      - 'scripts/check-omerta-v12-selfish-indic.mjs'
      - 'docs/OMERTA_V13_VOLUNTARY_TURNCOAT_RISK_80_20.md'
      - 'qa/omerta-v13-voluntary-turncoat-contract.json'
      - 'qa/omerta-v13-turncoat-choice-simulator.mjs'
      - 'scripts/check-omerta-v13-voluntary-indic.mjs'
      - 'docs/OMERTA_V14_INVESTIGATOR_OFFERS_RANK_RETALIATION.md'
      - 'qa/omerta-v14-investigator-offers-and-rank-retaliation.json'
      - 'qa/omerta-v14-investigator-offer-simulator.mjs'
      - 'scripts/check-omerta-v14-investigator-offers.mjs'
      - 'docs/OMERTA_V15_CONDITIONAL_PROTECTION_BY_RANK.md'
      - 'qa/omerta-v15-protection-contract.json'
      - 'qa/omerta-v15-protection-review-simulator.mjs'
      - 'scripts/check-omerta-v15-protection.mjs'
      - 'omerta-santoro-family-v7.js'
      - 'omerta-santoro-family-v7.css'
      - 'index.html'
      - 'qa/omerta-v7-release-contract.json'
      - 'scripts/check-omerta-v7-gates.mjs'
      - '.github/workflows/omerta-editorial-gates.yml'
  push:
    branches:
      - 'docs/non-cartel-dlc-rework-**'
    paths:
      - 'docs/OMERTA_SANTORO_FIVE_STANDALONE_CASES_V7.md'
      - 'docs/OMERTA_SANTORO_V8_VIOLENCE_INDIC_FAMILY_TREE.md'
      - 'qa/omerta-v8-mafia-release-contract.json'
      - 'scripts/check-omerta-v8-mafia.mjs'
      - 'scripts/check-omerta-v9-player-tree.mjs'
      - 'docs/OMERTA_V11_MANDATORY_SECRET_INFORMANT_FIVE_95_CASES.md'
      - 'qa/omerta-v11-indic-mandatory-95-contract.json'
      - 'scripts/check-omerta-v11-indic-95.mjs'
      - 'docs/OMERTA_V12_PERSONAL_INDIC_AND_MAFIA_ATMOSPHERE.md'
      - 'qa/omerta-v12-indic-self-interest-and-atmosphere.json'
      - 'scripts/check-omerta-v12-selfish-indic.mjs'
      - 'docs/OMERTA_V13_VOLUNTARY_TURNCOAT_RISK_80_20.md'
      - 'qa/omerta-v13-voluntary-turncoat-contract.json'
      - 'qa/omerta-v13-turncoat-choice-simulator.mjs'
      - 'scripts/check-omerta-v13-voluntary-indic.mjs'
      - 'docs/OMERTA_V14_INVESTIGATOR_OFFERS_RANK_RETALIATION.md'
      - 'qa/omerta-v14-investigator-offers-and-rank-retaliation.json'
      - 'qa/omerta-v14-investigator-offer-simulator.mjs'
      - 'scripts/check-omerta-v14-investigator-offers.mjs'
      - 'docs/OMERTA_V15_CONDITIONAL_PROTECTION_BY_RANK.md'
      - 'qa/omerta-v15-protection-contract.json'
      - 'qa/omerta-v15-protection-review-simulator.mjs'
      - 'scripts/check-omerta-v15-protection.mjs'
      - 'omerta-santoro-family-v7.js'
      - 'omerta-santoro-family-v7.css'
      - 'index.html'
      - 'qa/omerta-v7-release-contract.json'
      - 'scripts/check-omerta-v7-gates.mjs'
      - '.github/workflows/omerta-editorial-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-omerta-80-20:
    name: Four editorial laws, five standalone cases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed design branch
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enforce OMERTA V7 editorial gates
        run: node scripts/check-omerta-v7-gates.mjs
      - name: Check Santoro family viewer JS syntax
        run: node --check omerta-santoro-family-v7.js && node --check scripts/check-omerta-v8-mafia.mjs
      - name: Validate OMERTA V8 violent cases, informant privacy and family tree
        run: node scripts/check-omerta-v8-mafia.mjs
      - name: Validate player-owned Mafia ranks and hidden informer status
        run: node scripts/check-omerta-v9-player-tree.mjs
      - name: Validate V14 investigator-only C2+ offers and rank-controlled retaliation
        run: node scripts/check-omerta-v14-investigator-offers.mjs
      - name: Validate V15 protection approval tiers and rank-sensitive risk
        run: node scripts/check-omerta-v15-protection.mjs
      - name: Explain what this does NOT certify
        run: |
          echo 'This job validates public editorial structure only.'
          echo 'V11/V12 mandatory-informant and V13 self-initiated offer rules are archived; V14 is current.'
          echo 'Private A/B/C, secure server implementation, safety, role distribution, production data, and human playtests require separate release QA.'
