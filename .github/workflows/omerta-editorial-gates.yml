permissions:
  contents: read

jobs:
  check-omerta-80-20:
    name: Four editorial laws, five standalone cases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed design branch
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enforce OMERTA V7 editorial gates
        run: node scripts/check-omerta-v7-gates.mjs
      - name: Check Santoro family viewer JS syntax
        run: node --check omerta-santoro-family-v7.js && node --check scripts/check-omerta-v8-mafia.mjs
      - name: Validate OMERTA V8 violent cases, informant privacy and family tree
        run: node scripts/check-omerta-v8-mafia.mjs
      - name: Validate player-owned Mafia ranks and hidden informer status
        run: node scripts/check-omerta-v9-player-tree.mjs
      - name: Validate V16 single-screen acceptance and optional later disclosure
        run: node scripts/check-omerta-v16-immediate-indic-goal.mjs
      - name: Validate V15 protection approval tiers and rank-sensitive risk
        run: node scripts/check-omerta-v15-protection.mjs
      - name: Validate V17 player guidance and double-game source autonomy
        run: node scripts/check-omerta-v17-clear-instructions-double-agent.mjs
      - name: Validate V18 suspect and indic measurable personal victory conditions
        run: node scripts/check-omerta-v18-win-conditions.mjs
      - name: Validate V19 exact player goal copy by Mafia rank and dossier
        run: node scripts/check-omerta-v19-verbatim-goals.mjs
      - name: Validate V20 personal informant stakes without arbitrary-target victories
        run: node scripts/check-omerta-v20-self-interested-target-choice.mjs
      - name: Validate V21 role-by-role self-interested suspect and informant goals
        run: node scripts/check-omerta-v21-goals.mjs
      - name: Validate V22 coherence of complementing role interests and no duplicate objectives
        run: node scripts/check-omerta-v22-goal-coherence.mjs
      - name: Validate V22 cast-specific distinct goals and unsupported variants fail closed
        run: node scripts/check-omerta-v22-cast-complementarity.mjs
      - name: Validate V22 variant-authored random Santoro ranks and no generic Suspect role
        run: node scripts/check-omerta-v22-random-mafia-roles.mjs
      - name: Validate V23 simple AND conditions for informant win and optional private fact disclosure
        run: node scripts/check-omerta-v23-indic-and-goals.mjs
      - name: Validate V23 indic victory requires personal safety AND verified voluntary disclosure
        run: node scripts/check-omerta-v23-informant-two-checks.mjs
      - name: Audit 021 A/B/C pilot blockers without exposing sealed variants
        run: node scripts/check-omerta-021-variant-pilot-public.mjs
      - name: Explain what this does NOT certify
        run: |
          echo 'This job validates public editorial structure only.'
          echo 'V23 supersedes old informant scoring: personal escape AND voluntarily deliver one genuine private tip. V16 still governs accepting informant status and goal.'
          echo 'Private A/B/C, secure server implementation, safety, role distribution, production data, and human playtests require separate release QA.'
