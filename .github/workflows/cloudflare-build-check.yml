name: Cloudflare Build Check

on:
  pull_request:
    branches: [main, 'feature/v87-canonical-narrative-investigator-dossier']
    paths: &runtime_paths
      - 'cloudflare-worker.mjs'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '_headers'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - 'index.html'
      - 'en.html'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'styles-v11.css'
      - 'polish-v12.css'
      - 'ui-polish-v12.css'
      - 'omerta-v12.css'
      - 'omerta-polish-v12.css'
      - 'role-tree-polish-v12-29.css'
      - 'omerta-v12-30.css'
      - 'app-v11.js'
      - 'qa-fixes-v12.js'
      - 'investigation-sheet-v12.js'
      - 'video-v12-3.js'
      - 'turn-v12-4.js'
      - 'profile-dossier-v12.js'
      - 'playstore-ready-v12.js'
      - 'social-v12.js'
      - 'notifications-v12.js'
      - 'native-lifecycle-v12.js'
      - 'runtime-optimization-v12.js'
      - 'gameplay-simple-v12.js'
      - 'apple-ui-stability-v12.js'
      - 'gameplay-clean-v12.js'
      - 'live-cell-v12-44.js'
      - 'i18n-en-v12.js'
      - 'language-v12.js'
      - 'rules-v12.js'
      - 'locale-settings-v12.js'
      - 'ui-polish-v12.js'
      - 'store-catalog-v69.js'
      - 'locale-runtime-v12-23.js'
      - 'omerta-v12.js'
      - 'omerta-polish-v12.js'
      - 'omerta-hotfix-v12.js'
      - 'role-tree-polish-v12-29.js'
      - 'omerta-v12-30.js'
      - 'assets/**'
      - 'casino/**'
      - 'casino-client-v105.*'
      - 'heritage-casino-v91.*'
      - 'cloudflare-worker.mjs'
      - '.github/workflows/cloudflare-build-check.yml'
      - '.github/workflows/cloudflare-production-deploy.yml'
  push:
    branches: [main]
    paths: *runtime_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate UI runtime
        run: |
          node --check locale-settings-v12.js
          node --check rules-v12.js
          node --check ui-polish-v12.js
          node --check omerta-v12.js
          node --check omerta-polish-v12.js
          node --check role-tree-polish-v12-29.js
          node --check omerta-v12-30.js
          node --check live-cell-v12-44.js
          node scripts/ui-regression-check.mjs
      - name: Build canonical web bundle
        run: npm run build
      - name: Validate generated CARTEL posters
        run: node scripts/cartel-posters-check.mjs dist
      - name: Validate Los Salcedo canon and public fear arc
        run: |
          node --check dlc-suite-v12-37.js
          node scripts/cartel-mexico-world-check.mjs
      - name: Audit narrative role separation and code syntax
        run: node scripts/v87-narrative-check.mjs
      - name: Validate canonical variants and saga locks
        run: node scripts/v88-narrative-variant-check.mjs
      - name: Audit private manuscript tooling without story spoilers
        run: node scripts/v90-private-variant-check.mjs --self-test
      - name: Verify scenario 007 remains fail-closed until full editorial release
        run: node scripts/v284-007-guard-check.mjs
      - name: Verify private 007 audit tool syntax without shipping story data
        run: python3 -m py_compile scripts/v285-007-private-pack-audit.py
      - name: Verify confidential variant staging and bundle exclusion
        run: node scripts/v99-private-release-check.mjs
      - name: Check 011 secure runtime contracts
        run: node scripts/v380-011-release-integration-check.mjs
      - name: Check 012 secure runtime contracts
        run: node scripts/v400-012-release-integration-check.mjs
      - name: Check 013 security and six-player runtime contracts
        run: node scripts/v420-013-release-integration-check.mjs
      - name: Audit 014 private dossier runtime and verdict
        run: node scripts/v440-014-release-integration-check.mjs
      - name: Verify 015 private variant and client integration
        run: node scripts/v460-015-release-integration-check.mjs
      - name: Verify 016 canonical briefing neutrality
        run: node scripts/v481-016-neutral-briefing-check.mjs
      - name: Audit v100 private variant preview release barriers
        run: node scripts/v100-private-preview-check.mjs
      - name: Validate v101 campaign continuity
        run: node scripts/v101-omerta-branch-check.mjs
      - name: Audit v102 private role-specific clue visibility
        run: node scripts/v102-role-simulator-check.mjs
      - name: Reject unverified variant proof sources
        run: node scripts/v103-proof-release-check.mjs
      - name: Verify multiplayer synchronization
        run: node scripts/multiplayer-sync-check.mjs dist
      - name: Verify Casino authority, privacy, games and durable storage boundaries
        run: |
          node scripts/casino-foundation-check.mjs
          node scripts/casino-runtime-check.mjs
          node scripts/casino-poker-exhaustive-check.mjs
          node scripts/casino-release-check.mjs dist
          node scripts/storage-persistence-check.mjs
      - name: Validate public access before Cloudflare packaging
        run: |
          node --check cloudflare-worker.mjs
          node scripts/public-access-check.mjs
      - name: Validate Cloudflare Worker package
        run: npx --yes wrangler@4.102.0 deploy --dry-run --outdir .wrangler-dry-run
      - name: Exercise actual Cloudflare request semantics
        run: npx --yes --package=wrangler@4.102.0 -c 'node scripts/casino-worker-runtime-check.mjs'
