name: Deploy Cloudflare Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'PLAYTEST_NEXT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  verify:
    name: Build production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Upload deployable bundle
        uses: actions/upload-artifact@v4
        with:
          name: inside-grey-room-web
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy inside-grey-room-last
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9a82f465d035a633a04d79bf25103120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Deploy Worker when credentials are configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Deployment skipped: configure CLOUDFLARE_API_TOKEN in repository secrets."
            exit 0
          fi
          npx --yes wrangler@4.102.0 deploy --config wrangler.jsonc
