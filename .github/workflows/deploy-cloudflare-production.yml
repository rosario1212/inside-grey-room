name: Deploy Cloudflare Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'PLAYTEST_NEXT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  verify:
    name: Build production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Upload deployable bundle
        uses: actions/upload-artifact@v4
        with:
          name: inside-grey-room-web
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy inside-grey-room-last
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9a82f465d035a633a04d79bf25103120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Deploy Worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          npx --yes wrangler@4.102.0 deploy --config wrangler.jsonc
      - name: Ensure managed TURN credentials
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(npx --yes wrangler@4.102.0 secret list --config wrangler.jsonc || true)"
          if printf '%s' "$CURRENT" | grep -q 'CF_TURN_KEY_ID' && printf '%s' "$CURRENT" | grep -q 'CF_TURN_KEY_TOKEN'; then
            echo "Managed TURN secrets already configured."
            exit 0
          fi

          TMP_BODY="$(mktemp)"
          HTTP_STATUS="$(curl --silent --show-error \
            -o "$TMP_BODY" \
            -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/calls/turn_keys" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"name":"inside-grey-room-production"}')"

          if [[ ! "$HTTP_STATUS" =~ ^2 ]]; then
            node - "$TMP_BODY" "$HTTP_STATUS" <<'NODE'
          const fs = require('fs');
          const [file, status] = process.argv.slice(2);
          let message = `Cloudflare TURN request failed with HTTP ${status}`;
          try {
            const body = JSON.parse(fs.readFileSync(file, 'utf8'));
            const errors = Array.isArray(body.errors) ? body.errors.map(e => e && e.message).filter(Boolean) : [];
            if (errors.length) message += `: ${errors.join('; ')}`;
          } catch {}
          console.error(message);
          NODE
            rm -f "$TMP_BODY"
            exit 1
          fi

          TURN_VALUES="$(node - "$TMP_BODY" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          let body;
          try { body = JSON.parse(fs.readFileSync(file, 'utf8')); }
          catch { console.error('Cloudflare TURN returned invalid JSON.'); process.exit(2); }
          const result = body && body.result && typeof body.result === 'object' ? body.result : body;
          const uid = result && result.uid;
          const key = result && result.key;
          if (!uid || !key) {
            const errors = Array.isArray(body && body.errors) ? body.errors.map(e => e && e.message).filter(Boolean) : [];
            console.error(errors.length ? `Cloudflare TURN API: ${errors.join('; ')}` : 'Cloudflare TURN response did not contain credentials.');
            process.exit(2);
          }
          process.stdout.write(`${uid}\n${key}`);
          NODE
          )"
          rm -f "$TMP_BODY"

          TURN_UID="$(printf '%s' "$TURN_VALUES" | sed -n '1p')"
          TURN_KEY="$(printf '%s' "$TURN_VALUES" | sed -n '2p')"
          echo "::add-mask::$TURN_UID"
          echo "::add-mask::$TURN_KEY"

          printf '%s' "$TURN_UID" | npx --yes wrangler@4.102.0 secret put CF_TURN_KEY_ID --config wrangler.jsonc
          printf '%s' "$TURN_KEY" | npx --yes wrangler@4.102.0 secret put CF_TURN_KEY_TOKEN --config wrangler.jsonc
          echo "Managed Cloudflare TURN configured."
