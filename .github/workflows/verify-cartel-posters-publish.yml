name: Verify CARTEL posters production deployment
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-cartel-posters-publish.yml'
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy-current-main:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/verify-cartel-posters-deploy-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Validate generated posters and build
        run: |
          npm run build
          node scripts/cartel-posters-check.mjs dist
      - name: Publish production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.102.0 deploy
