name: Heritage MAITRE v716 QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'heritage-maitre-data-v34.js'
      - 'heritage-maitre-v34.js'
      - 'heritage-maitre-online-v34-4.js'
      - 'heritage-audit-v55.js'
      - 'scripts/v716-maitre-*.mjs'
      - 'scripts/v55-heritage-audit-check.mjs'
      - 'scripts/v71-heritage-release-check.mjs'
      - 'supabase/migrations/*heritage_maitre_majority_consent_v716.sql'
      - 'supabase/tests/igr_v716_maitre_*.sql'
      - '.github/workflows/heritage-maitre-v716-qa.yml'
  push:
    branches: [main]
    paths:
      - 'heritage-maitre-data-v34.js'
      - 'heritage-maitre-v34.js'
      - 'heritage-maitre-online-v34-4.js'
      - 'heritage-audit-v55.js'
      - 'scripts/v716-maitre-*.mjs'
      - 'scripts/v55-heritage-audit-check.mjs'
      - 'scripts/v71-heritage-release-check.mjs'
      - 'supabase/migrations/*heritage_maitre_majority_consent_v716.sql'
      - 'supabase/tests/igr_v716_maitre_*.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    name: MAÎTRE 5–7 courtroom and online
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Syntax, campaign simulation, recovery and controls
        run: |
          node --check heritage-maitre-data-v34.js
          node --check heritage-maitre-v34.js
          node --check heritage-maitre-online-v34-4.js
          node --check heritage-audit-v55.js
          node scripts/v716-maitre-playtest-check.mjs
          node scripts/v716-maitre-online-check.mjs
          node scripts/v71-heritage-release-check.mjs
  postgres:
    name: MAÎTRE isolated 5–7 vote and consent
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heritage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heritage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply disposable schema and all three collective ballot migrations
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d heritage_test -f supabase/tests/igr_v713_cendres_ballot_harness.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d heritage_test -f supabase/migrations/20261115230500_heritage_cendres_majority_ballot_v713.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d heritage_test -f supabase/migrations/20261116005000_heritage_kuroi_majority_ballot_v715.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d heritage_test -f supabase/tests/igr_v716_maitre_fixture.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d heritage_test -f supabase/migrations/20261116020000_heritage_maitre_majority_consent_v716.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d heritage_test -f supabase/tests/igr_v716_maitre_majority_consent_integration.sql
