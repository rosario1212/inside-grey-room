name: Screen Layout Check
on:
  pull_request:
    branches: [main]
    paths:
      - 'screen-polish-v73.css'
      - 'startup-stability-v13-3.css'
      - 'app-v11.js'
      - 'omerta-v12-39.js'
      - 'mobile-ui-v28.js'
      - 'interface-polish-v14.js'
      - 'navigation-theme-v18.js'
      - 'authoritative-runtime-v41.js'
      - 'gameplay-flow-v13.js'
      - 'play-modes-v13-8.js'
      - 'heritage-maitre-polish-v34.js'
      - 'heritage-maitre-online-v34-4.js'
      - 'heritage-maitre-assets-v34.js'
      - 'heritage-maitre-mobile-v34-5.js'
      - 'heritage-maitre-v34.js'
      - 'heritage-premium-v13-6.js'
      - 'assets/heritage-maitre-*'
      - 'scripts/screen-layout-check.mjs'
      - 'scripts/maitre-poster-layout-check.mjs'
      - 'scripts/desktop-layout-check.mjs'
      - 'scripts/runtime-fluidity-check.mjs'
      - 'scripts/audit-gameplay-check.mjs'
      - 'scripts/apply-lobby-display-v72.mjs'
      - '.github/workflows/screen-layout-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Build canonical web bundle
        run: npm ci --no-audit --no-fund
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify screen layouts
        env:
          IGR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/screen-layout-check.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screen-layout-results
          path: layout-check-results
          if-no-files-found: ignore
