name: Heritage KUROI v715 QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'heritage-v13-5.js'
      - 'heritage-play-v13-7.js'
      - 'play-modes-v13-8.js'
      - 'scripts/v715-kuroi-*.mjs'
      - 'scripts/v713-cendres-online-check.mjs'
      - 'supabase/migrations/*heritage_kuroi_majority_ballot_v715.sql'
      - 'supabase/tests/igr_v715_kuroi_*.sql'
      - '.github/workflows/heritage-kuroi-v715-qa.yml'
  push:
    branches: [main]
    paths:
      - 'heritage-v13-5.js'
      - 'heritage-play-v13-7.js'
      - 'play-modes-v13-8.js'
      - 'scripts/v715-kuroi-*.mjs'
      - 'scripts/v713-cendres-online-check.mjs'
      - 'supabase/migrations/*heritage_kuroi_majority_ballot_v715.sql'
      - 'supabase/tests/igr_v715_kuroi_*.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    name: KUROI 5–7 player campaign and UI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Full KUROI paths and CENDRES regression
        run: |
          node --check heritage-v13-5.js
          node --check heritage-play-v13-7.js
          node --check play-modes-v13-8.js
          node scripts/v715-kuroi-playtest-check.mjs
          node scripts/v713-cendres-online-check.mjs
          node scripts/v713-cendres-playtest-check.mjs
          node scripts/v714-cendres-final-hardening-check.mjs
  postgres:
    name: KUROI isolated majority database
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heritage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heritage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Fresh CENDRES schema then KUROI candidate
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d heritage_test -f supabase/tests/igr_v713_cendres_ballot_harness.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d heritage_test -f supabase/migrations/20261115230500_heritage_cendres_majority_ballot_v713.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d heritage_test -f supabase/migrations/20261116005000_heritage_kuroi_majority_ballot_v715.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d heritage_test -f supabase/tests/igr_v715_kuroi_majority_integration.sql
