name: Cloudflare Production Deploy
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker.mjs'
      - 'wrangler.jsonc'
      - 'index.html'
      - 'en.html'
      - 'assets/**'
      - '*.css'
      - '*.js'
      - 'scripts/**'
      - '.github/workflows/cloudflare-production-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify Cloudflare credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify public access and build
        run: |
          node --check cloudflare-worker.mjs
          node scripts/public-access-check.mjs
          npm run build
          node scripts/cartel-posters-check.mjs dist
      - name: Deploy Inside Grey Room to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.102.0 deploy
