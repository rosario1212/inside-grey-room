name: Cloudflare Production Deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Publish Cloudflare pending commit status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"state":"pending","context":"Cloudflare Production","description":"Workers deployment and production checks pending"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
      - name: Verify Cloudflare credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify public access and private room sessions and build
        run: |
          node --check cloudflare-worker.mjs
          node scripts/public-access-check.mjs
          npm run build
          node scripts/v280-006-mountain-ui-release-check.mjs dist
          node scripts/v284-006-detailed-ui-check.mjs dist
          node scripts/v287-five-case-ui-release-check.mjs dist
          node scripts/v643-hidden-ignorances-check.mjs
          node scripts/v644-relation-facts-check.mjs
          node scripts/v645-005-shortcards-check.mjs
          node scripts/v87-narrative-check.mjs
          node scripts/v99-private-release-check.mjs
          node scripts/v380-011-release-integration-check.mjs
          node scripts/v400-012-release-integration-check.mjs
          node scripts/v420-013-release-integration-check.mjs
          node scripts/v440-014-release-integration-check.mjs
          node scripts/v460-015-release-integration-check.mjs
          node scripts/optional-roles-003-008-009-011-check.mjs
          node scripts/v498-case-role-editorial-check.mjs
          node scripts/v481-016-neutral-briefing-check.mjs
          node scripts/v482-016-private-release-gate-check.mjs
          node scripts/v483-016-evidence-ledger-check.mjs
          node scripts/v491-016-release-integrity-check.mjs
          node scripts/v532-017-release-integrity-check.mjs
          node scripts/v560-018-release-integrity-check.mjs
          node scripts/v580-019-release-integrity-check.mjs
          node scripts/v620-020-release-integrity-check.mjs
          # Release hygiene: Omerta standalone checks must pass before any live Worker deploy.
          # These are synthetic/structural tests, never human editorial certification.
          node scripts/omerta-money-intel-021-check.mjs
          node scripts/omerta-indic-final-rule-check.mjs
          node scripts/omerta-standalone-goal-scorer-check.mjs
          node scripts/omerta-santoro-private-ui-check.mjs
          node scripts/omerta-santoro-display-check.mjs
          node scripts/omerta-santoro-lobby-visual-check.mjs
          node scripts/omerta-023-spy-ui-check.mjs
          node scripts/omerta-santoro-private-preflight-check.mjs
          node scripts/omerta-santoro-indic-ui-check.mjs
          node scripts/omerta-santoro-card-completeness-check.mjs
          node scripts/omerta-indic-final-review-v27-check.mjs
          node scripts/omerta-santoro-verdict-v28-check.mjs
          node scripts/v630-hidden-spy-release-check.mjs
          node scripts/v631-spy-audit-regression-check.mjs
          node scripts/casino-runtime-check.mjs
          node scripts/casino-release-check.mjs dist
          node scripts/cartel-posters-check.mjs dist
      - name: Exercise the Cloudflare relay runtime
        run: npx --yes --package=wrangler@4.102.0 -c 'node scripts/casino-worker-runtime-check.mjs'
      - name: Deploy Inside Grey Room to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.102.0 deploy
      - name: Diagnose active Worker and published metadata
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Expected repository commit: ${GITHUB_SHA}"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; for(const f of ['casino-release.json','cartel030-release.json','cartel031-release.json']){const d=JSON.parse(readFileSync('dist/'+f));console.log('Bundled '+f+' commit: '+d.commit)}"
          npx --yes wrangler@4.102.0 deployments list --name inside-grey-room-last || true
          curl --silent --show-error --max-time 15 --dump-header /tmp/igr-meta-headers \
            "https://inside-grey-room-last.alial-khafaji2002.workers.dev/casino-release.json?verify=${GITHUB_SHA}" \
            --output /tmp/igr-meta || true
          grep -Ei '^(HTTP/|cf-cache-status:|age:|cache-control:|cf-ray:|etag:)' /tmp/igr-meta-headers || true
          head -c 240 /tmp/igr-meta || true
          echo
          for asset in / /index-omerta-editorial-20261109.txt /omerta-v12-omerta-editorial-20261109.js; do
            echo "Inspecting edge asset: ${asset}"
            curl --silent --show-error --max-time 15 --dump-header /tmp/igr-edge-headers \
              "https://inside-grey-room-last.alial-khafaji2002.workers.dev${asset}?diagnostic=${GITHUB_SHA}" \
              --output /tmp/igr-edge-body || true
            grep -Ei '^(HTTP/|cf-cache-status:|content-type:|cache-control:|cf-ray:)' /tmp/igr-edge-headers || true
            node --input-type=module -e "import {readFileSync} from 'node:fs';const s=readFileSync('/tmp/igr-edge-body','utf8');console.log('Bytes:',s.length,'Fresh script URL:',s.includes('omerta-v12-omerta-editorial-20261109.js'),'New 021:',s.includes('Chaque vendredi, des commerçants du quartier remettent leur contribution'),'New 025:',s.includes('Vittorio Santoro dirige une famille dont l’autorité repose sur des règles'))" || true
          done
      - name: Verify deployed game and commit
        env:
          IGR_EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/casino-deployment-check.mjs
      - name: Publish Cloudflare success commit status
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"state":"success","context":"Cloudflare Production","description":"Worker deployed and commit verified"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
      - name: Publish Cloudflare failure commit status
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"state":"failure","context":"Cloudflare Production","description":"Workers deployment or production verification failed"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
