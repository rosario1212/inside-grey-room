name: v765 — Cast personnalisé Omertà et Cartel
on:
  pull_request:
    paths:
      - 'supabase/migrations/*igr_v765_cast_pseudonyms_omerta_cartel.sql'
      - 'scripts/v765-named-suspects-qa.mjs'
      - '.github/workflows/v765-cast-pseudonyms-qa.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*igr_v765_cast_pseudonyms_omerta_cartel.sql'
      - 'scripts/v765-named-suspects-qa.mjs'
      - '.github/workflows/v765-cast-pseudonyms-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alias-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v765-named-suspects-qa.mjs
