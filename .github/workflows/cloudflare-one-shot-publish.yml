name: One-shot Cloudflare production publish
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-one-shot-publish.yml'
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy-main:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/one-shot-cloudflare-deploy-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current main, not the PR
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN GitHub secret"; exit 1; }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify public access and build
        run: |
          node --check cloudflare-worker.mjs
          node scripts/public-access-check.mjs
          npm run build
      - name: Publish main to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.102.0 deploy
