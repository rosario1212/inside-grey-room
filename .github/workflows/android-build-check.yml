name: Android Build Check

on:
  push:
    branches: [main]
    paths: &runtime_paths
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'index.html'
      - 'en.html'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'styles-v11.css'
      - 'polish-v12.css'
      - 'ui-polish-v12.css'
      - 'omerta-v12.css'
      - 'app-v11.js'
      - 'qa-fixes-v12.js'
      - 'investigation-sheet-v12.js'
      - 'video-v12-3.js'
      - 'turn-v12-4.js'
      - 'profile-dossier-v12.js'
      - 'playstore-ready-v12.js'
      - 'social-v12.js'
      - 'notifications-v12.js'
      - 'native-lifecycle-v12.js'
      - 'runtime-optimization-v12.js'
      - 'gameplay-simple-v12.js'
      - 'apple-ui-stability-v12.js'
      - 'gameplay-clean-v12.js'
      - 'native-store-boundary-v14.js'
      - 'i18n-en-v12.js'
      - 'language-v12.js'
      - 'rules-v12.js'
      - 'locale-settings-v12.js'
      - 'ui-polish-v12.js'
      - 'locale-runtime-v12-23.js'
      - 'omerta-v12.js'
      - 'privacy.html'
      - 'terms.html'
      - 'delete-account.html'
      - 'support.html'
      - 'assets/**'
      - '.github/workflows/android-build-check.yml'
  pull_request:
    branches: [main]
    paths: *runtime_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate JavaScript runtime
        run: |
          node --check app-v11.js
          node --check qa-fixes-v12.js
          node --check investigation-sheet-v12.js
          node --check video-v12-3.js
          node --check turn-v12-4.js
          node --check profile-dossier-v12.js
          node --check playstore-ready-v12.js
          node --check social-v12.js
          node --check notifications-v12.js
          node --check native-lifecycle-v12.js
          node --check runtime-optimization-v12.js
          node --check gameplay-simple-v12.js
          node --check apple-ui-stability-v12.js
          node --check gameplay-clean-v12.js
          node --check native-store-boundary-v14.js
          node --check i18n-en-v12.js
          node --check language-v12.js
          node --check rules-v12.js
          node --check locale-settings-v12.js
          node --check ui-polish-v12.js
          node --check omerta-v12.js
          node scripts/ui-regression-check.mjs
      - name: Build production web bundle
        run: npm run mobile:build
      - name: Create Android shell
        run: npx cap add android
      - name: Sync and harden
        run: |
          npx cap sync android
          node scripts/prepare-android.mjs
      - name: Compile debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Compile release AAB
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: inside-grey-room-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: inside-grey-room-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
