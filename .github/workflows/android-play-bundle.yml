name: Android Play Bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Store version (x.y.z)'
        default: '1.0.0'
        required: true
      version_code:
        description: 'Unique increasing build number'
        default: '121100'
        required: true

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and synchronize Android project
        run: npm run android:sync

      - name: Build release App Bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo 'Missing ANDROID_KEYSTORE_BASE64' && exit 1)
          test -n "$STORE_PASS" || (echo 'Missing ANDROID_KEYSTORE_PASSWORD' && exit 1)
          test -n "$KEY_ALIAS" || (echo 'Missing ANDROID_KEY_ALIAS' && exit 1)
          test -n "$KEY_PASS" || (echo 'Missing ANDROID_KEY_PASSWORD' && exit 1)
          trap 'rm -f upload-keystore.jks' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > upload-keystore.jks
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          rm -f upload-keystore.jks

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: inside-grey-room-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
