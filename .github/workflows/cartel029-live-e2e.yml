name: CARTEL 029 Live Multiplayer QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/cartel029-live-e2e.mjs'
      - '.github/workflows/cartel029-live-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-production-qa:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'test/cartel029-live-multiplayer-20261019' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner
        run: npm install --no-save --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.62.1
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise LIVE 11-player CARTEL 029 game
        timeout-minutes: 11
        env:
          IGR_LIVE_BASE: https://inside-grey-room-last.alial-khafaji2002.workers.dev
          IGR_LIVE_SEATS: '11'
        run: node scripts/cartel029-live-e2e.mjs
