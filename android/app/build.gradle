plugins {
    id 'com.android.application'
}

android {
    namespace 'com.insidegreyroom.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.insidegreyroom.game'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir "$buildDir/generated/webAssets"
    }
}

def repoRoot = rootProject.projectDir.parentFile

def syncWebAssets = tasks.register('syncWebAssets', Copy) {
    into "$buildDir/generated/webAssets/www"
    from(repoRoot) {
        include 'index.html'
        include 'app-v11.js'
        include 'audio-stability-v12.js'
        include 'qa-fixes-v12.js'
        include 'styles-v11.css'
        include 'manifest.webmanifest'
        include 'service-worker.js'
    }
    from(new File(repoRoot, 'assets')) {
        into 'assets'
    }
}

tasks.named('preBuild').configure {
    dependsOn syncWebAssets
}
